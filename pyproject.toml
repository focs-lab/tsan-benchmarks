[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbench"
dynamic = ["version"]
dependencies = [
    "pyyaml"
]
authors = [
  { name="Daniel Lim", email="dwslim2@gmail.com" },
]
description = "ThreadSanitizer Benchmarking Tool"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
tbench = "tbench:main"

[project.urls]
Homepage = "https://github.com/focs-lab/tsan-benchmarks"
Issues = "https://github.com/focs-lab/tsan-benchmarks/issues"
